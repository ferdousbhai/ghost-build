packages:
  - 'ghostbuild-agent'
  - 'template'
ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Reviewed, exact-version Ghostkit releases pinned by lockfile integrity.
  - '@summonghost/compaction@0.1.1'
  - '@summonghost/title-generation@0.1.0'
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
strictDepBuilds: true
blockExoticSubdeps: true
overrides:
  # @blitz/eslint-plugin still resolves the GHSA-3jxr-9vmj-r5cp-affected patch levels.
  'brace-expansion@<1.1.16': '1.1.16'
  'brace-expansion@>=2.0.0 <2.1.2': '2.1.2'
  # AJV accepts this patched release, but the minimum-release-age policy
  # otherwise retains the GHSA-v2hh-gcrm-f6hx-affected version.
  'fast-uri@>=3.0.0 <=3.1.3': '3.1.4'
  # Miniflare's affected pin is compatible with the patched sharp line used by
  # current Cloudflare tooling.
  'sharp@<0.35.0': '0.35.3'
allowBuilds:
  core-js-pure: true
  esbuild: true
  sharp: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    # Type-only v5 is compatible with the currently published Agents packages.
    '@cloudflare/workers-types': '5'
    # @blitz/eslint-plugin is exercised by the repository's ESLint 9 validation.
    eslint: '9'
