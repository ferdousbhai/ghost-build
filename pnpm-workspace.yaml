packages:
  - 'ghostbuild-agent'
  - 'template'
ignoreWorkspaceRootCheck: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Reviewed preview dependency. Ghostbuild intentionally adopts this exact
  # release before the normal age gate as part of the Computer runtime cutover.
  - '@cloudflare/computer@0.1.1'
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
strictDepBuilds: true
blockExoticSubdeps: true
overrides:
  # Keep every transitive range on the fully patched brace-expansion releases.
  'brace-expansion@<1.1.18': '1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '2.1.4'
  'brace-expansion@>=4.0.0 <5.0.9': '5.0.9'
  # Reviewed security releases accepted by the existing transitive ranges.
  '@hono/node-server@<2.0.10': '2.0.10'
  'fast-uri@>=3.0.0 <3.1.5': '3.1.5'
  'hono@<4.12.34': '4.12.34'
  'ip-address@<=10.3.0': '10.3.1'
  'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
  'postcss@<=8.5.22': '8.5.25'
  'undici@>=7.0.0 <7.29.0': '7.29.0'
  # Miniflare's affected pin is compatible with the patched sharp line used by
  # current Cloudflare tooling.
  'sharp@<0.35.0': '0.35.3'
allowBuilds:
  # The OPFS adapter uses wa-sqlite's published dist artifacts. Its postinstall
  # only downloads the unrelated optional PowerSync core.
  '@journeyapps/wa-sqlite': false
  # Computer's shell emulation treats these native compression bindings as
  # optional. Keep their install scripts disabled in the Worker build.
  '@mongodb-js/zstd': false
  core-js-pure: true
  esbuild: true
  node-liblzma: false
  sharp: true
  workerd: true
peerDependencyRules:
  allowedVersions:
    # Type-only v5 is compatible with the currently published Agents packages.
    '@cloudflare/workers-types': '5'
    # @blitz/eslint-plugin is exercised by the repository's ESLint 9 validation.
    eslint: '9'
# Computer 0.1.1 probes 256 blob hashes in one statement; Durable Object
# SQLite accepts fewer bind variables. Remove this when upstream lowers it.
patchedDependencies:
  '@cloudflare/computer@0.1.1': patches/@cloudflare__computer@0.1.1.patch
