version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /ghostbuild-agent
      - /template
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    groups:
      cloudflare-ai:
        patterns:
          - '@ai-sdk/*'
          - '@cloudflare/*'
          - agents
          - ai
          - workers-ai-provider
          - wrangler
      remaining:
        patterns:
          - '*'
