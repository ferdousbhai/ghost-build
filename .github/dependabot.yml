version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /ghostbuild-agent
      - /sandbox-tools
      - /template
    schedule:
      interval: weekly
    open-pull-requests-limit: 6
    groups:
      xterm-suite:
        patterns:
          - '@xterm/*'
        update-types:
          - minor
          - patch
      cloudflare-ai-peer-family:
        patterns:
          - ai
          - '@ai-sdk/*'
          - agents
          - '@cloudflare/ai-chat'
          - workers-ai-provider
        update-types:
          - minor
          - patch
      react-runtime:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      tanstack-suite:
        patterns:
          - '@tanstack/*'
        update-types:
          - minor
          - patch
      web-tooling:
        patterns:
          - '@babel/*'
          - '@eslint/*'
          - '@types/*'
          - '@vitejs/*'
          - eslint
          - eslint-*
          - globals
          - knip
          - postcss
          - prettier
          - typescript
          - typescript-eslint
          - vite
          - vitest
        update-types:
          - minor
          - patch
      sandbox-runtime:
        patterns:
          - '@cloudflare/sandbox'
        update-types:
          - minor
          - patch
      cloudflare-platform:
        patterns:
          - '@cloudflare/*'
          - wrangler
        update-types:
          - minor
          - patch
      monorepo-dependencies:
        group-by: dependency-name
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
