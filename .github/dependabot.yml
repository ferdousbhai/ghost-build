version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 8
    groups:
      ai-runtime:
        patterns:
          - '@ai-sdk/*'
          - '@cloudflare/ai-chat'
          - agents
          - ai
          - workers-ai-provider
        update-types:
          - minor
          - patch
      cloudflare-runtime:
        patterns:
          - '@cloudflare/*'
          - wrangler
        update-types:
          - minor
          - patch
      tanstack:
        patterns:
          - '@tanstack/*'
        update-types:
          - minor
          - patch
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
        update-types:
          - minor
          - patch
      production:
        dependency-type: production
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Helsinki
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
