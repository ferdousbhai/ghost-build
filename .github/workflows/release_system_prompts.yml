name: Create System Prompts Release

on:
  push:
    branches:
      - main
    paths:
      - 'ghostbuild-agent/prompts/**'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup dependencies
        uses: ./.github/actions/setup-and-build

      - name: Build System Prompts
        run: |
          pnpm run build:system-prompts
          node dist/buildSystemPrompts.js

      - name: Create Release
        id: create_release
        uses: rymndhng/release-on-push-action@aebba2bbce07a9474bf95e8710e5ee8a9e922fe2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bump_version_scheme: patch
          tag_prefix: prompts-v
          release_name: 'Ghostbuild System Prompts <RELEASE_VERSION>'
          release_body: |
            ## Ghostbuild System Prompts Release

            This release contains the compiled system prompts used by the Ghostbuild AI assistant.

            ### Files included:
            - `ghostbuild-system-prompts.txt` - Complete system prompts as sent to the AI model

            Generated automatically from the latest prompt changes in the ghostbuild-agent.

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "ghostbuild-system-prompts.txt" ]; then
            gh release upload "${{ steps.create_release.outputs.tag_name }}" "ghostbuild-system-prompts.txt" --clobber
            echo "Uploaded ghostbuild-system-prompts.txt to release"
          else
            echo "ghostbuild-system-prompts.txt not found"
            exit 1
          fi
