name: Create System Prompts Release

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-and-build/action.yaml'
      - '.github/workflows/release_system_prompts.yml'
      - '.nvmrc'
      - 'buildSystemPrompts.ts'
      - 'ghostbuild-agent/prompts/**'
      - 'ghostbuild-agent/utils/stripIndent.ts'
      - 'ghostbuild-agent/package.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'scripts/create-system-prompts-release.mjs'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: system-prompts-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ferdousbhai/ghostbuild'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-and-build

      - name: Build System Prompts
        run: |
          pnpm run build:system-prompts
          node dist/buildSystemPrompts.js
          first_hash="$(sha256sum ghostbuild-system-prompts.txt | cut -d ' ' -f1)"
          node dist/buildSystemPrompts.js
          second_hash="$(sha256sum ghostbuild-system-prompts.txt | cut -d ' ' -f1)"
          test "$first_hash" = "$second_hash"
          echo "System prompts SHA-256: $second_hash"

      - name: Store compiled prompts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghostbuild-system-prompts
          path: ghostbuild-system-prompts.txt
          if-no-files-found: error

  release:
    if: github.repository == 'ferdousbhai/ghostbuild'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository metadata
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore compiled prompts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ghostbuild-system-prompts
          path: .

      - name: Create release and upload compiled prompts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/create-system-prompts-release.mjs
