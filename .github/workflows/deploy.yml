name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    if: github.repository == 'ferdousbhai/ghostbuild'
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-and-build

      - name: Validate repository
        run: pnpm run validate

      - name: Verify tracked generated files are current
        run: git diff --exit-code

      - name: Provision production Cloudflare resources
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run provision:production

      - name: Verify production Cloudflare config
        run: pnpm run verify:production-config

      - name: Validate production runtime variables
        env:
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.CLOUDFLARE_OAUTH_CLIENT_ID }}
        run: node scripts/deploy-production.mjs --check

      - name: Apply production D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm run d1:migrations:apply:production

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy --var COMMIT_SHA:${{ github.sha }} --var CLOUDFLARE_OAUTH_CLIENT_ID:${{ vars.CLOUDFLARE_OAUTH_CLIENT_ID }}

      - name: Verify live deployment stabilization
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-live-deployment.mjs local

      - name: Verify deployment from multiple regions
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-live-deployment.mjs global
