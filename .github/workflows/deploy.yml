name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup dependencies
        uses: ./.github/actions/setup-and-build
        with:
          run-build: 'false'

      - name: Verify stack alignment
        run: pnpm run verify:stack

      - name: Verify generated app template
        run: pnpm run verify:template

      - name: Typecheck Cloudflare Worker
        run: pnpm run typecheck

      - name: Provision production Cloudflare resources
        run: pnpm run provision:production

      - name: Verify production Cloudflare config
        run: pnpm run verify:production-config

      - name: Verify production bundle
        run: |
          pnpm run build
          pnpm run lint
          pnpm run test
          pnpm run knip

      - name: Apply production D1 migrations
        run: pnpm run d1:migrations:apply:production

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy
