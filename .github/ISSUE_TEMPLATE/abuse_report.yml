name: Abuse report
description: Report harmful or prohibited use of Ghostbuild
title: '[Abuse]: '
labels:
  - abuse
assignees:
  - ferdousbhai
body:
  - type: markdown
    attributes:
      value: >-
        This issue is public. Do not include credentials, private personal data, exploit details, or confidential
        project content. Do not download, copy, or attach suspected illegal imagery. Use https://abuse.cloudflare.com/
        for sensitive evidence or live Cloudflare-hosted abuse, and report security vulnerabilities privately.
        Ghostbuild aims to review and acknowledge reports within two weekdays, but this is not a guarantee, contractual
        service level, or emergency-response service. For immediate danger contact local emergency services.
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Harmful content
        - Impersonation or fraud
        - Unauthorized automation or access
        - Policy or safeguard evasion
        - Misuse of a generated application
        - Other prohibited use
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: Give enough non-sensitive context to locate and assess the concern.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I removed credentials, private personal data, exploit details, and confidential project content.
          required: true
        - label: This is not a security vulnerability.
          required: true
